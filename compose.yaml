services:
  invoker:
    build: .
    env_file: ".env"
    environment:
      token: ${token}
      external_mongo: ${external_mongo}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      internal_mongo: "mongo"
      PYTHONUNBUFFERED: 1
    ports:
      - "8080:5000"
    develop:
      watch:
        - action: sync
          path: .
          target: /
